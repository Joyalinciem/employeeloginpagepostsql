services:
  - type: web
    name: employee-login-postgresql
    runtime: node
    rootDir: .
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    plan: free
    envVars:
      - key: DB_MODE
        value: postgres
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false   # Set in Render dashboard (e.g. smtp.gmail.com)
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false   # Set in Render dashboard
      - key: SMTP_PASS
        sync: false   # Set in Render dashboard
      - key: EMAIL_FROM
        sync: false   # Set in Render dashboard
